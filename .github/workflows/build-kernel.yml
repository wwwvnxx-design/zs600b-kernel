name: build-zs600b-kernel

# 手动触发：仓库 Actions 页 -> 本工作流 -> Run workflow
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: '内核 defconfig 名称'
        required: false
        default: 'rockchip_defconfig'
      extra_config:
        description: '额外打开 UVC/USB20/DEBUG_FS 等选项（M2 用；M1 验证编译链时选 false）'
        type: boolean
        required: false
        default: true
      trim:
        description: '裁剪与启动无关的子系统（注意：不能裁 CONFIG_TRACING / CONFIG_ARM_UNWIND，rockchip 预编译 rk_ftl_arm_v7.S 依赖它们）'
        type: boolean
        required: false
        default: false
      fbconsole:
        description: '内建 console=tty0 + ignore_loglevel，让内核日志显示在屏幕上'
        type: boolean
        required: false
        default: true
      kernel_ref:
        description: 'rockchip-linux/kernel 分支'
        required: false
        default: 'release-3.10'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm
      KVER: ${{ github.event.inputs.kernel_ref || 'release-3.10' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'rockchip_defconfig' }}
      TC: x86_64-gcc-4.9.4-nolibc-arm-linux-gnueabi
      KSRC: ${{ github.workspace }}/.ksrc
      KTGZ: /home/runner/k.tar.gz

    steps:
      - name: 取本仓库（迁移包）
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -y
          # lzop 必需：CONFIG_KERNEL_LZO=y 时 scripts/Makefile.lib 的 cmd_lzo 直接调 lzop -9
          sudo apt-get install -y --no-install-recommends \
            build-essential xz-utils lzop lz4 bison flex libssl-dev libelf-dev bc \
            perl python3 rsync cpio kmod device-tree-compiler

      - name: 下载 ARM 交叉工具链 (gcc 4.9.4 nolibc)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tc"
          ok=0
          for U in \
            "https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/4.9.4/${TC}.tar.xz" \
            "https://mirrors.ustc.edu.cn/kernel.org/tools/crosstool/files/bin/x86_64/4.9.4/${TC}.tar.xz" \
            "https://mirrors.tuna.tsinghua.edu.cn/kernel/tools/crosstool/files/bin/x86_64/4.9.4/${TC}.tar.xz" ; do
            echo "尝试: $U"
            if curl -fL --retry 2 --connect-timeout 15 -o /tmp/tc.tar.xz "$U"; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "::error::工具链下载全部失败"; exit 1; }
          tar -xJf /tmp/tc.tar.xz -C "$HOME/tc"
          CC="$HOME/tc/gcc-4.9.4-nolibc/arm-linux-gnueabi/bin/arm-linux-gnueabi-gcc"
          test -x "$CC" || { echo "::error::找不到 $CC"; ls -R "$HOME/tc" | head -50; exit 1; }

          # 该工具链的 cc1 动态依赖 libmpfr.so.4（MPFR 3.x 的 SONAME），
          # Ubuntu 22.04 只带 libmpfr.so.6，必须单独补老库，否则：
          #   cc1: error while loading shared libraries: libmpfr.so.4
          # libgmp.so.10 / libmpc.so.3 在 jammy 都有，无需处理。
          ok2=0
          for U in \
            "http://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb" \
            "http://security.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb" ; do
            if curl -fL --retry 2 --connect-timeout 15 -o /tmp/libmpfr4.deb "$U"; then ok2=1; break; fi
          done
          [ "$ok2" = 1 ] || { echo "::error::libmpfr4 下载失败"; exit 1; }
          mkdir -p "$HOME/tc/libs"
          dpkg -x /tmp/libmpfr4.deb "$HOME/tc/libs"
          MPFR_DIR="$HOME/tc/libs/usr/lib/x86_64-linux-gnu"
          ls -l "$MPFR_DIR" | head -5
          echo "LD_LIBRARY_PATH=$MPFR_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$MPFR_DIR:${LD_LIBRARY_PATH:-}"

          "$CC" --version | head -2
          # 真正驱动一次 cc1，确认库能加载（--version 不碰 cc1，测不出来）
          echo 'int main(void){return 0;}' > /tmp/probe.c
          "$CC" -c /tmp/probe.c -o /tmp/probe.o || { echo "::error::cc1 无法运行，工具链不可用"; exit 1; }
          echo "cc1 自检通过"
          echo "CROSS_COMPILE=$HOME/tc/gcc-4.9.4-nolibc/arm-linux-gnueabi/bin/arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: 缓存内核源码包
        id: kcache
        uses: actions/cache@v4
        with:
          path: ${{ env.KTGZ }}
          key: rk-kernel-tgz-${{ env.KVER }}-v1

      - name: 解包内核源码（永远从干净包展开）
        run: |
          set -euo pipefail
          if [ ! -s "$KTGZ" ]; then
            echo "缓存未命中，下载源码..."
            curl -fL --retry 3 --connect-timeout 20 -o "$KTGZ" \
              "https://codeload.github.com/rockchip-linux/kernel/tar.gz/refs/heads/${KVER}"
          else
            echo "命中缓存: $(du -h "$KTGZ" | cut -f1)"
          fi
          rm -rf "$KSRC" "$GITHUB_WORKSPACE/.tmpk"
          mkdir -p "$GITHUB_WORKSPACE/.tmpk"
          tar -xzf "$KTGZ" -C "$GITHUB_WORKSPACE/.tmpk"
          mv "$GITHUB_WORKSPACE/.tmpk/kernel-${KVER}" "$KSRC"
          rmdir "$GITHUB_WORKSPACE/.tmpk"
          echo "源码大小: $(du -sh "$KSRC" | cut -f1)"
          # 确认 mali 许可文件在位（决定 Kbuild 走 GPL 还是 proprietary 分支）
          ls -l "$KSRC/drivers/gpu/arm/mali400/mali/linux/license/gpl/" || true

      - name: 生成 .config
        run: |
          set -euo pipefail
          # 注意：不要在这里罗列 -Wno-error=<type>。gcc 对未知警告名会直接报
          #   cc1: error: '-Wno-error=xxx': no option '-Wxxx'
          # 而不同版本引入的警告名不同（dangling-pointer / use-after-free 是 gcc 12+）。
          # 只用 -Wno-error 全局降级，任何 gcc 版本都识别。
          HOSTCFLAGS_SAFE="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -fcommon -Wno-error"
          echo "HOSTCFLAGS_SAFE=$HOSTCFLAGS_SAFE" >> "$GITHUB_ENV"
          echo "host gcc: $(gcc --version | head -1)"

          cd "$KSRC"
          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
               "HOSTCFLAGS=$HOSTCFLAGS_SAFE" "$DEFCONFIG"

          if [ "${{ github.event.inputs.extra_config }}" = "true" ]; then
            echo "== 追加 M2 配置 =="
            {
              echo ""
              echo "CONFIG_USB20_HOST=y"
              echo "CONFIG_USB20_OTG=y"
              echo "# CONFIG_USB_DWC2 is not set"
              echo "CONFIG_MEDIA_SUPPORT=y"
              echo "CONFIG_MEDIA_USB_SUPPORT=y"
              echo "CONFIG_MEDIA_CAMERA_SUPPORT=y"
              echo "CONFIG_USB_VIDEO_CLASS=y"
              echo "CONFIG_VIDEO_DEV=y"
              echo "CONFIG_DEBUG_FS=y"
              echo "CONFIG_IKCONFIG=y"
              echo "CONFIG_IKCONFIG_PROC=y"
              echo "CONFIG_KERNEL_LZO=y"
            } >> "$KSRC/.config"
          else
            echo "== M1 原样 defconfig，不追加配置 =="
          fi

          if [ "${{ github.event.inputs.trim }}" = "true" ]; then
            echo "== 裁剪：与原厂内核尺寸包络对齐 =="
            # 依据：原厂 ks.txt 63525 符号 vs 官方 defconfig 85039 符号，多出 30532 个。
            # 多出的主要是 BT/WLAN、netfilter、ftrace/kprobe/perf、部分 V4L2/DRM。
            # 原厂机器上这些功能不依赖内核（无 WiFi/BT 模块、无 ftrace 需求），
            # 裁剪只影响调试能力与未使用驱动，不影响 USB/显示/存储/输入。
            {
              echo "# CONFIG_BT is not set"
              echo "# CONFIG_BT_HCIUART is not set"
              echo "# CONFIG_BT_RFCOMM is not set"
              echo "# CONFIG_CFG80211 is not set"
              echo "# CONFIG_MAC80211 is not set"
              echo "# CONFIG_RFKILL is not set"
              echo "# CONFIG_WLAN is not set"
              echo "# CONFIG_WIRELESS is not set"
              echo "# CONFIG_NETFILTER is not set"
              echo "# CONFIG_NF_CONNTRACK is not set"
              echo "# CONFIG_IP_NF_IPTABLES is not set"
              echo "# CONFIG_IP6_NF_IPTABLES is not set"
              echo "# CONFIG_XFRM_USER is not set"
              echo "# CONFIG_NET_SCHED is not set"
              echo "# CONFIG_SND_USB_AUDIO is not set"
              echo "# CONFIG_SND_SOC is not set"
              echo "# CONFIG_INPUT_JOYDEV is not set"
              echo "# CONFIG_MEDIA_TUNER is not set"
              echo "# CONFIG_DVB_CORE is not set"
              echo "# CONFIG_CRYPTO_USER is not set"
              echo "# CONFIG_CRYPTO_TEST is not set"
            } >> "$KSRC/.config"
          fi

          if [ "${{ github.event.inputs.fbconsole }}" = "true" ]; then
            echo "== 打开 VT + framebuffer console（原厂 defconfig 把 CONFIG_VT 关了）=="
            # rockchip_defconfig 是 Android 版，CONFIG_VT / FRAMEBUFFER_CONSOLE 全关，
            # 所以内核 panic 时屏幕上什么都没有。这里补上，配合 CONFIG_CMDLINE 的
            # console=tty0 就能在平板上直接看到内核日志。
            {
              echo "CONFIG_VT=y"
              echo "CONFIG_VT_CONSOLE=y"
              echo "CONFIG_HW_CONSOLE=y"
              echo "CONFIG_FRAMEBUFFER_CONSOLE=y"
              echo "CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y"
              echo "CONFIG_DUMMY_CONSOLE=y"
              echo "CONFIG_FONTS=y"
              echo "CONFIG_FONT_8x16=y"
              echo "CONFIG_FONT_8x8=y"
              echo "CONFIG_LOGO=y"
              echo 'CONFIG_CMDLINE="console=tty0 ignore_loglevel keep_bootcon loglevel=8"'
              echo "CONFIG_CMDLINE_EXTEND=y"
              echo "# CONFIG_CMDLINE_FORCE is not set"
            } >> "$KSRC/.config"
          fi

          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
               "HOSTCFLAGS=$HOSTCFLAGS_SAFE" olddefconfig

      - name: 编译 zImage
        run: |
          set -euo pipefail
          cd "$KSRC"
          # rockchip 3.10 顶层 Makefile 第 356 行：只要 scripts/gcc-wrapper.py 存在就
          #   CC = $(srctree)/scripts/gcc-wrapper.py $(CROSS_COMPILE)gcc
          # 该脚本是 Python 2 语法（print "...")，runner 上 python=python3 直接 SyntaxError。
          # 它只解析 stderr 把 warning 当错误，不改变编译参数，删掉不影响产物。
          rm -f "$KSRC/scripts/gcc-wrapper.py"
          make ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
               "HOSTCFLAGS=$HOSTCFLAGS_SAFE" \
               KCFLAGS="-Wno-error -fno-strict-aliasing" \
               -j"$(nproc)" zImage
          ls -l "$KSRC/arch/arm/boot/zImage"

      - name: 符号体检
        if: always()
        run: |
          if [ -s "$KSRC/System.map" ]; then
            python3 verify_kallsyms.py --map "$KSRC/System.map" --stock artifacts/ks_stock.txt \
              | tee kallsyms-report.txt || true
          else
            echo "System.map 不存在（编译未完成）" | tee kallsyms-report.txt
          fi

      - name: 打包 boot.img
        if: success()
        run: |
          set -euo pipefail
          # 注意：不要加 --check。该参数要求内核尺寸与基底完全一致才通过，
          # 换成新内核必然不同；结构完整性已由脚本内置 assert（kernel/ramdisk/second 回读比对）保证。
          python3 repack_boot.py \
            --base artifacts/boot_device.img \
            --kernel "$KSRC/arch/arm/boot/zImage" \
            --out boot-new.img | tee repack.log
          ls -l boot-new.img
          cp "$KSRC/arch/arm/boot/zImage" zImage
          cp "$KSRC/System.map" System.map
          cp "$KSRC/.config" kernel.config
          {
            echo "### 编译产物"
            echo '```'
            echo "zImage       : $(stat -c%s zImage) B"
            echo "boot-new.img : $(stat -c%s boot-new.img) B"
            echo "gcc          : $("${CROSS_COMPILE}gcc" --version | head -1)"
            echo '```'
            echo "### 尺寸包络（原厂基线）"
            echo '```'
            echo "原厂 _end-_text : 0x00e5e494 (15066260 B)  zImage 5137568 B"
            awk '$3=="_text"{t=strtonum("0x"$1)} $3=="_end"{e=strtonum("0x"$1)} END{printf "本期 _end-_text : 0x%08x (%d B)\n", e-t, e-t}' System.map
            echo '```'
            echo "### 关键配置实际取值"
            echo '```'
            grep -E '^CONFIG_(USB20_HOST|USB20_OTG|USB_VIDEO_CLASS|VIDEO_DEV|MEDIA_USB_SUPPORT|DEBUG_FS|KERNEL_LZO|IKCONFIG)' kernel.config || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zs600b-kernel-${{ github.run_number }}
          path: |
            zImage
            System.map
            kernel.config
            boot-new.img
            kallsyms-report.txt
            repack.log
          retention-days: 30

      - name: 失败时保留现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zs600b-failure-${{ github.run_number }}
          path: |
            kernel.config
            kallsyms-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: 符号体检报告贴到摘要
        if: always()
        run: |
          {
            echo ""
            echo "### 符号体检"
            echo '<details><summary>展开</summary>'
            echo ""
            echo '```'
            head -80 kallsyms-report.txt 2>/dev/null || echo "(无)"
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
